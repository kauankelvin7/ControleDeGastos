<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KiNance — Onboarding</title>
  <meta name="theme-color" content="#e5591d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/pages/onboarding.css">
</head>
<body>
  <div class="onboarding-header">
    <div class="onboarding-logo-mark">K₿</div>
    <h1 class="onboarding-title">Bem-vindo ao KiNance</h1>
    <p class="onboarding-subtitle">Configure seu perfil para começar a acompanhar seu patrimônio.</p>
  </div>

  <form class="onboarding-form" id="form-onboarding" novalidate>
    <div class="form-group">
      <label class="input-label" for="ob-nome">Seu nome</label>
      <input class="input" id="ob-nome" type="text" placeholder="Como quer ser chamado?" autocomplete="given-name" aria-required="true">
    </div>

    <div class="form-group">
      <label class="input-label">Tickers na sua carteira</label>
      <p class="input-hint">Selecione os FIIs que você já tem ou planeja investir</p>
      <div class="tickers-grid" id="tickers-sugeridos"></div>
      <div class="ticker-input-row" style="margin-top: var(--space-3)">
        <input class="input" id="ticker-custom" type="text" placeholder="Adicionar outro (ex: BTLG11)" maxlength="8" style="text-transform:uppercase">
        <button type="button" class="btn-secondary" id="btn-add-ticker" style="width:auto;padding:var(--space-3) var(--space-4)">Adicionar</button>
      </div>
      <div class="tickers-grid" id="tickers-custom" style="margin-top:var(--space-2)"></div>
    </div>

    <div class="form-group">
      <label class="input-label" for="ob-meta-patrimonio">Meta de patrimônio</label>
      <div class="input-prefix-wrap">
        <span class="input-prefix">R$</span>
        <input class="input" id="ob-meta-patrimonio" type="number" min="0" step="1000" placeholder="100000" inputmode="numeric">
      </div>
    </div>

    <div class="form-group">
      <label class="input-label" for="ob-meta-dividendo">Meta de dividendo mensal</label>
      <div class="input-prefix-wrap">
        <span class="input-prefix">R$</span>
        <input class="input" id="ob-meta-dividendo" type="number" min="0" step="100" placeholder="1000" inputmode="numeric">
      </div>
    </div>

    <div class="form-group">
      <label class="input-label" for="ob-meta-reserva">Meta de reserva de emergência</label>
      <div class="input-prefix-wrap">
        <span class="input-prefix">R$</span>
        <input class="input" id="ob-meta-reserva" type="number" min="0" step="500" placeholder="15000" inputmode="numeric">
      </div>
    </div>

    <div class="login-error" id="ob-error" role="alert" aria-live="assertive"></div>
    <button type="submit" class="btn-primary onboarding-cta" id="btn-comecar">
      Começar o KiNance 🚀
    </button>
  </form>

  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
  <script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { app, db } from "/js/firebase.js";
    import { TICKERS_SUGERIDOS } from "/js/constants.js";
    import { showToast } from "/js/utils.js";

    const auth = getAuth(app);
    let user = null;
    const tickersSelecionados = new Set();
    const tickersCustom = new Set();

    // Guard de rota
    onAuthStateChanged(auth, (u) => {
      if (!u) { window.location.replace("/index.html"); return; }
      user = u;
    });

    // Chips sugeridos
    const grid = document.getElementById("tickers-sugeridos");
    TICKERS_SUGERIDOS.forEach(t => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ticker-chip";
      btn.textContent = t;
      btn.onclick = () => {
        if (tickersSelecionados.has(t)) {
          tickersSelecionados.delete(t);
          btn.classList.remove("selected");
        } else {
          tickersSelecionados.add(t);
          btn.classList.add("selected");
        }
      };
      grid.appendChild(btn);
    });

    document.getElementById("btn-add-ticker").onclick = () => {
      const input = document.getElementById("ticker-custom");
      const val = input.value.trim().toUpperCase();
      if (!val || !/^[A-Z]{4}\d{2}$/.test(val)) {
        showToast("Ticker inválido (ex: BTLG11)", "error"); return;
      }
      if (tickersCustom.has(val)) { showToast("Já adicionado", "warning"); return; }
      tickersCustom.add(val);
      const container = document.getElementById("tickers-custom");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ticker-chip selected";
      btn.dataset.ticker = val;
      btn.innerHTML = `${val} <span style="opacity:0.6;cursor:pointer" data-remove="${val}">×</span>`;
      btn.querySelector("[data-remove]").onclick = (e) => {
        e.stopPropagation();
        tickersCustom.delete(val);
        btn.remove();
      };
      container.appendChild(btn);
      input.value = "";
    };

    function showError(msg) {
      const el = document.getElementById("ob-error");
      el.textContent = msg;
      el.classList.add("visible");
    }

    document.getElementById("form-onboarding").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!user) return;
      const nome = document.getElementById("ob-nome").value.trim();
      if (!nome) { showError("Informe seu nome."); return; }

      const tickers = [...tickersSelecionados, ...tickersCustom];
      const btn = document.getElementById("btn-comecar");
      btn.disabled = true;
      btn.textContent = "Salvando...";

      try {
        await setDoc(doc(db, "users", user.uid), {
          nome,
          email: user.email,
          metaPatrimonio:        Number(document.getElementById("ob-meta-patrimonio").value) || 100000,
          metaDividendoMensal:   Number(document.getElementById("ob-meta-dividendo").value) || 1000,
          reservaEmergenciaAlvo: Number(document.getElementById("ob-meta-reserva").value) || 15000,
          tickers: tickers.length > 0 ? tickers : ["MXRF11"],
          onboardingCompleto: true,
          criadoEm: new Date().toISOString(),
        }, { merge: true });
        window.location.replace("/dashboard.html");
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Começar o KiNance 🚀";
        showError("Erro ao salvar. Verifique sua conexão.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
