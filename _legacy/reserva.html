<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KiNance — Reserva de Emergência</title>
  <meta name="theme-color" content="#e5591d">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/sidebar.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" role="navigation"></aside>
    <div class="app-main">
      <header class="page-header">
        <div>
          <h1 class="page-title">Reserva</h1>
          <p class="page-subtitle">Reserva de emergência</p>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--font-display);font-size:var(--text-xs);color:var(--text-muted)">Saldo atual</div>
          <div style="font-family:var(--font-mono);font-size:var(--text-2xl);font-weight:700;color:var(--success)" id="reserva-saldo-header">—</div>
        </div>
      </header>

      <div class="app-content">
        <!-- Progress bar -->
        <div class="card card--success" style="margin-bottom:var(--space-4)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)">
            <span class="section-title">Meta de emergência</span>
            <span style="font-family:var(--font-mono);font-size:var(--text-lg);font-weight:700;color:var(--success)" id="reserva-pct">0%</span>
          </div>
          <div class="progress-bar" style="height:8px">
            <div class="progress-bar__fill progress-bar__fill--success" id="reserva-bar" style="width:0%"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:var(--space-2)">
            <span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted)" id="reserva-saldo-label">R$ 0</span>
            <span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted)" id="reserva-meta-label">R$ 0</span>
          </div>
        </div>

        <div class="page-two-col">
          <!-- Form -->
          <div class="form-panel">
            <div class="card card--success" style="display:flex;flex-direction:column;gap:var(--space-4)">
              <div class="section-title">Registrar movimentação</div>
              <form id="form-reserva" novalidate style="display:flex;flex-direction:column;gap:var(--space-4)">

                <div class="form-group">
                  <label class="input-label">Tipo</label>
                  <div style="display:flex;gap:var(--space-2)">
                    <button type="button" class="btn-secondary" id="btn-deposito" style="flex:1;border-color:var(--success);color:var(--success)" onclick="setTipoReserva('deposito')" aria-pressed="true">💰 Depósito</button>
                    <button type="button" class="btn-secondary" id="btn-retirada" style="flex:1" onclick="setTipoReserva('retirada')" aria-pressed="false">↩️ Retirada</button>
                  </div>
                  <input type="hidden" id="reserva-tipo" value="deposito">
                </div>

                <div class="form-group">
                  <label class="input-label" for="reserva-valor">Valor (R$)</label>
                  <input class="input" id="reserva-valor" type="number" placeholder="0,00" min="0.01" step="0.01" inputmode="decimal" aria-required="true">
                </div>

                <div class="form-group">
                  <label class="input-label" for="reserva-onde">Onde está guardado</label>
                  <input class="input" id="reserva-onde" type="text" placeholder="ex: Tesouro Selic, Nubank" maxlength="60">
                </div>

                <div id="reserva-error" class="login-error" role="alert" style="display:none"></div>
                <button type="submit" class="btn-primary" id="btn-reserva" style="background:linear-gradient(135deg,#16a34a,var(--success))">Registrar</button>
              </form>
            </div>
          </div>

          <!-- Histórico -->
          <div>
            <div class="section-title" style="margin-bottom:var(--space-4)">Histórico de movimentações</div>
            <div id="lista-reserva" style="display:flex;flex-direction:column;gap:var(--space-2)">
              <div class="skeleton-card"><div class="skeleton skeleton--label"></div><div class="skeleton skeleton--value"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" role="navigation">
      <a href="/dashboard.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="11" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="3" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/></svg><span>Início</span></a>
      <a href="/aportes.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 15V5M5 10l5-5 5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Aportes</span></a>
      <button class="nav-fab" onclick="location.href='/aportes.html'">+</button>
      <a href="/gastos.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 5v10M5 10l5 5 5-5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Gastos</span></a>
      <a href="/relatorio.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="4" y="2" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.75"/><path d="M8 8h4M8 11h4M8 14h2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span>Relatório</span></a>
    </nav>
  </div>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
  <script type="module" src="/js/reserva.js"></script>
</body>
</html>
