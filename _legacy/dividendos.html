<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KiNance — Dividendos</title>
  <meta name="theme-color" content="#e5591d">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/sidebar.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" role="navigation"></aside>
    <div class="app-main">
      <header class="page-header">
        <div>
          <h1 class="page-title">Dividendos</h1>
          <p class="page-subtitle">Registre e acompanhe dividendos recebidos</p>
        </div>
        <!-- DY Cards no header desktop -->
        <div style="display:flex;gap:var(--space-3)">
          <div style="background:var(--amber-dim);border:1px solid rgba(255,164,60,0.2);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);text-align:center">
            <div style="font-family:var(--font-display);font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">DY/PM</div>
            <div style="font-family:var(--font-mono);font-size:var(--text-xl);font-weight:700;color:var(--amber);margin-top:2px" id="dy-pm">—%</div>
          </div>
          <div style="background:var(--orange-dim);border:1px solid rgba(229,89,29,0.2);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);text-align:center">
            <div style="font-family:var(--font-display);font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">DY/Mercado</div>
            <div style="font-family:var(--font-mono);font-size:var(--text-xl);font-weight:700;color:var(--orange);margin-top:2px" id="dy-atual">—%</div>
          </div>
        </div>
      </header>

      <div class="app-content">
        <div class="page-two-col">

          <!-- Form -->
          <div class="form-panel">
            <div class="card card--amber" style="display:flex;flex-direction:column;gap:var(--space-4)">
              <div class="section-title">Registrar dividendo</div>
              <form id="form-dividendo" novalidate style="display:flex;flex-direction:column;gap:var(--space-4)">

                <div class="form-group">
                  <label class="input-label" for="div-ticker">Ticker</label>
                  <input class="input" id="div-ticker" type="text" placeholder="MXRF11" maxlength="7" list="div-tickers-list" style="text-transform:uppercase" oninput="onDivTickerChange(this.value)" aria-required="true">
                  <datalist id="div-tickers-list"></datalist>
                  <div class="cotacao-badge" id="div-cotacao-badge" style="margin-top:var(--space-2)">Digite o ticker</div>
                </div>

                <div class="grid-2">
                  <div class="form-group">
                    <label class="input-label" for="div-valor-cota">Valor/cota (R$)</label>
                    <input class="input" id="div-valor-cota" type="number" placeholder="0.095" min="0.001" step="0.001" inputmode="decimal" aria-required="true" oninput="calcDivTotal()">
                  </div>
                  <div class="form-group">
                    <label class="input-label" for="div-total-cotas">Total cotas</label>
                    <input class="input" id="div-total-cotas" type="number" placeholder="0" min="1" step="1" inputmode="decimal" aria-required="true" oninput="calcDivTotal()">
                  </div>
                </div>

                <div class="total-display">
                  <div class="total-label">Total recebido</div>
                  <div class="total-value" id="div-total-display" style="color:var(--amber)">R$ 0,00</div>
                </div>

                <div class="form-group">
                  <label class="input-label" for="div-competencia">Competência</label>
                  <input class="input" id="div-competencia" type="month" aria-required="true">
                </div>

                <div class="form-group" style="flex-direction:row;align-items:center;gap:var(--space-3)">
                  <input type="checkbox" id="div-reinvestido" style="width:18px;height:18px;accent-color:var(--orange);flex-shrink:0">
                  <label for="div-reinvestido" class="input-label" style="cursor:pointer;margin:0">Reinvestido</label>
                </div>

                <div id="div-error" class="login-error" role="alert" style="display:none"></div>
                <button type="submit" class="btn-primary" id="btn-dividendo" style="background:linear-gradient(135deg,#b45309,var(--amber))">Registrar Dividendo</button>
              </form>
            </div>
          </div>

          <!-- Histórico -->
          <div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4)">
              <span class="section-title">Histórico</span>
            </div>
            <div id="lista-dividendos" style="display:flex;flex-direction:column;gap:var(--space-2)">
              <div class="skeleton-card"><div class="skeleton skeleton--label"></div><div class="skeleton skeleton--value"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" role="navigation">
      <a href="/dashboard.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="11" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="3" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/><rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.75"/></svg><span>Início</span></a>
      <a href="/aportes.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 15V5M5 10l5-5 5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Aportes</span></a>
      <button class="nav-fab" onclick="location.href='/aportes.html'">+</button>
      <a href="/gastos.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 5v10M5 10l5 5 5-5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Gastos</span></a>
      <a href="/relatorio.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="4" y="2" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.75"/><path d="M8 8h4M8 11h4M8 14h2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span>Relatório</span></a>
    </nav>
  </div>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
  <script type="module" src="/js/dividendos.js"></script>
</body>
</html>
