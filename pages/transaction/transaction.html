<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transação - Controle de Gastos</title>
    <link rel="stylesheet" href="transaction.css">
    <link rel="stylesheet" href="../../global.css">
</head>

<body>
    <header>
        <button type="button" class="quit-button" onclick="logout()">Sair</button>
    </header> 
    <main class="centralize">
        <form>
            <h1>Transação</h1>
            <div class="radio-group">
                <input type="radio" name="type" id="expense" value="expense" checked>
                <label for="expense">Despesa</label>
                <input type="radio" name="type" id="income" value="income">
                <label for="income">Receita</label>
            </div>

            <!-- Data -->
            <div class="form-group">
                <div><label>Data da transação *</label></div>
                <input type="date" onchange="onChangeDate()" id="date">
                <small id="data-error-message" class="error-message">Data é obrigatória.</small>
            </div>

            <!-- Moeda -->
            <div class="form-group">
                <div><label>Moeda *</label></div>
                <select onchange="onChangeCurrency()" id="currency">
                    <option value="">-- Selecione uma moeda --</option>
                    <option value="USD">Dólar</option>
                    <option value="EUR">Euro</option>
                    <option value="BRL" selected>Real</option>
                </select>
                <small id="currency-error-message" class="error-message">Moeda é obrigatória.</small>
            </div>

            <!-- Valor -->
            <div class="form-group">
                <div><label>Valor *</label></div>
                <input type="number" onchange="onChangeValue()" id="value">
                <small id="value-error-message" class="error-message">Valor deve ser maior que zero.</small>
            </div>

            <!-- Tipo de transação -->
            <div class="form-group">
                <div><label>Tipo de transação *</label></div>
                <select onchange="onChangeTransactionType()" id="transaction-type">
                    <option value="">-- Selecione um tipo de transação --</option>
                    <option value="Acomodação">Acomodação</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Salário">Salário</option>
                    <option value="Supermercado">Supermercado</option>
                    <option value="Outros">Outros</option>
                </select>
                <small id="transaction-error-message" class="error-message">Tipo de transação é obrigatório.</small>
            </div>

            <!-- Descrição -->
            <div class="form-group">
                <div><label>Descrição</label></div>
                <input type="text" id="description">
            </div>

            <!-- Botões -->
            <button type="button" class="solid" id="save-button" disabled onclick="saveTransaction()">Salvar</button>
            <button type="button" class="solid-two" onclick="back()">Cancelar</button>
        </form>
    </main>
</body>

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script src="/../../firebase-init.js"></script>
<script src="../../loading.js"></script>
<script src="../../auth-guard.js"></script>
<script src="transaction.js"></script>

</html>
