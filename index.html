<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Gastos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="global.css">
    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
    <link rel="manifest" href="icon/site.webmanifest">
    </head>

<body class="centralize">
    <form>
        <h1>Login</h1>
        <!-- Campo de Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required autocomplete="email" onchange="onChangeEmail()">
            <small id="email-error" class="error-message">Digite um email válido.</small>
        </div>

        <!-- Campo de Senha -->
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password" onchange="onChangePassword()">
            <small id="password-error" class="error-message">A senha deve ter no mínimo 8 caracteres, incluindo números e símbolos.</small>
        </div>

        <!-- Botões -->
        <div class="button-group">
            <button type="button" id="recover-password-button" class="clear" disabled onclick="recoverPassword()">Recuperar Senha</button>
            <button type="button" id="login-button" class="solid" disabled>Entrar</button>
            <button type="button" class="outline" onclick="register()">Registrar</button>
        </div>
    </form>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="firebase-init.js"></script>

    <!-- Seus scripts -->
    <script src="loading.js"></script>
    <script src="validations.js"></script>
    <script src="script.js"></script>
</body>
</html>
