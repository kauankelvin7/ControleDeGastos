<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Controle de Gastos</title>
    <link rel="stylesheet" href="/../../global.css">
    <link rel="stylesheet" href="register.css">
    <link rel="apple-touch-icon" sizes="180x180" href="../../icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icon/favicon-32x32.png">
    <link rel="manifest" href="../../icon/site.webmanifest">
</head>
<body class="centralize" style="display: flex; align-items: center; justify-content: center; min-height: 100dvh; background-color: var(--bg-base);">
    
    <form id="register-form">
        <header>
            <button type="button" class="btn-ghost quit-button" onclick="logout()">Sair</button>
        </header>
        
        <h1>Registre-se</h1>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="input" placeholder="seuemail@dominio.com" onchange="onChangeEmail()"/>
            <small id="email-error" class="error-message input-error-msg">Digite um email válido.</small>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" class="input" placeholder="Senha" onchange="onChangePassword()"/>
            <small id="password-error" class="error-message input-error-msg">A senha deve ter no mínimo 8 caracteres, incluindo números e símbolos.</small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Senha</label>
            <input type="password" id="confirmPassword" class="input" placeholder="Digite novamente a senha" onchange="onChangeConfirmPassword()"/>
            <small id="password-doesnt-match-error" class="error-message input-error-msg">As senhas não correspondem.</small>
        </div>

        <div>
            <button type="button" id="register-button" class="solid" disabled onclick="register()">Registrar</button>
        </div>
        <div>
            <button type="button" class="outline">Login</button>
        </div>
    </form>
    
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="/../../firebase-init.js"></script>
    <script src="register.js"></script>
    <script src="/../../loading.js"></script>
    <script src="/../../validations.js"></script>

</body>
</html>
