<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Controle de Gastos</title>
    <link rel="stylesheet" href="/../../global.css">
    <link rel="stylesheet" href="home.css">
    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icon/favicon-32x32.png">
    <link rel="manifest" href="../../icon/site.webmanifest">
</head>

<body>
    <div class="app-layout">
        <main class="app-main">
            <header class="page-header">
                <h1 class="page-title">Controle de Gastos</h1>
                <button type="button" class="btn-ghost quit-button" onclick="logout()">Sair</button>
            </header> 
            
            <div class="app-content">
                <section class="section">
                    <ol id="transactions"></ol>
                </section>
            </div>
            
            <button class="nav-fab fixed bottom right" style="position: fixed; bottom: 24px; right: 24px;" onclick="newTransaction()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <script src="/../../firebase-init.js"></script>
    <script src="../../loading.js"></script>
    <script src="../../auth-guard.js"></script>
    <script src="home.js"></script>
</body>
</html>
